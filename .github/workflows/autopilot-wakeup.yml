name: Laburito social autopilot wake-up

on:
  schedule:
    # GitHub ejecuta este chequeo cada cinco minutos; el worker respeta next_run_at.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [appjet]

permissions:
  contents: read

concurrency:
  group: laburito-autopilot-wakeup
  cancel-in-progress: false

jobs:
  missing-url:
    if: ${{ vars.LABURITO_URL == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain the one-time URL configuration
        run: |
          echo "::error::Falta LABURITO_URL. Configurá la URL Edge real de AppJet (rama appjet) para habilitar el chequeo del despliegue real."
          exit 1

  wake-app:
    if: ${{ vars.LABURITO_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake Laburito and verify API health
        env:
          LABURITO_URL: ${{ vars.LABURITO_URL }}
        run: |
          set -eu
          BASE_URL="${LABURITO_URL%/}"
          echo "Waking Laburito at ${BASE_URL}"
          for attempt in $(seq 1 6); do
            RESPONSE="$(curl --fail --show-error --silent \
              --connect-timeout 8 --max-time 20 \
              "${BASE_URL}/api/health" || true)"
            echo "$RESPONSE"
            if echo "$RESPONSE" | jq -e '.ok == true and .worker.worker_alive == true' >/dev/null 2>&1; then
              echo "Laburito API and background worker are healthy."
              exit 0
            fi
            echo "Worker not ready yet (attempt $attempt/6)."
            sleep 15
          done
          echo "Laburito did not report a healthy background worker."
          exit 1

  deployment-smoke:
    if: ${{ github.event_name == 'push' && vars.LABURITO_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for the AppJet edge deployment and verify real health
        env:
          LABURITO_URL: ${{ vars.LABURITO_URL }}
        run: |
          set -eu
          BASE_URL="${LABURITO_URL%/}"
          sleep 30
          for attempt in $(seq 1 8); do
            RESPONSE="$(curl --fail --show-error --silent --connect-timeout 8 --max-time 20 "${BASE_URL}/api/health" || true)"
            echo "$RESPONSE"
            if echo "$RESPONSE" | jq -e '.ok == true and .worker.worker_alive == true' >/dev/null 2>&1; then
              if ! echo "$RESPONSE" | jq -e '.persistence.configured == true or .persistence.local_persistent == true' >/dev/null 2>&1; then
                echo "::error::The deployed app has no durable storage. Configure Supabase Storage or a persistent volume before using real projects."
                exit 1
              fi
              curl --fail --show-error --silent --max-time 20 "${BASE_URL}/" >/dev/null
              echo "AppJet edge app, frontend, worker, and durable storage are healthy."
              exit 0
            fi
            echo "Deployment not ready (attempt $attempt/8)."
            sleep 15
          done
          echo "::error::The AppJet edge deployment did not become healthy."
          exit 1
