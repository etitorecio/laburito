name: Validate Laburito

on:
  push:
    branches: [appjet]
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/**"
      - "docker-compose.yml"
  pull_request:
    branches: [appjet]
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/**"
      - "requirements.txt"
      - "Dockerfile"
      - "docker-compose.yml"
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: APP_TOKEN=ci-test docker compose config --quiet
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app tests
      - name: Run offline backend tests
        run: python -m unittest discover -s tests -v
      - name: Install FFmpeg and local speech runtime
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
      - name: Run complete local render pipeline
        env:
          AITUBER_DISABLE_EXTERNAL_MEDIA: "1"
        run: python scripts/e2e_local.py
      - name: Install and synthesize with the CC0 Spanish Piper voice
        run: python scripts/test_piper.py

      - name: Start the real HTTP application
        env:
          AITUBER_DATA_DIR: /tmp/laburito-live-smoke
          AITUBER_DISABLE_EXTERNAL_MEDIA: "1"
        run: |
          mkdir -p "$AITUBER_DATA_DIR"
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8080 > /tmp/laburito-live-smoke.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/health > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/laburito-live-smoke.log
          exit 1
      - name: Exercise the deployed-style HTTP flow end to end
        env:
          AITUBER_DATA_DIR: /tmp/laburito-live-smoke
        run: python scripts/live_smoke.py http://127.0.0.1:8080

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build the self-hosted production container
        run: docker build --pull -t laburito:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
